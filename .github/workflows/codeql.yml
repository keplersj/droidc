name: codeql

# CodeQL code scanning for the Rust workspace and the workflows themselves. Findings go to the
# repository's Security tab and as annotations on the PR; nothing here fails a job, so it is
# report-only until the ruleset is told to require code scanning results.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "41 6 * * 1" # weekly, so new queries run against main even when nothing changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF results
    strategy:
      fail-fast: false
      matrix:
        # Rust and Actions are both analysed from source, without a build.
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
