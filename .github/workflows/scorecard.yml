name: scorecard

# OpenSSF Scorecard: supply-chain checks on the repository's own setup (pinned actions, token
# permissions, branch protection, dependency updates and so on). Results go to the Security tab as
# code scanning alerts. They are not published to the public Scorecard API (publish_results: false).
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "17 7 * * 1" # weekly
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    name: OpenSSF Scorecard
    # Scorecard only reads the default branch.
    if: github.ref == 'refs/heads/main' || github.event_name == 'branch_protection_rule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: Summary
        run: |
          {
            echo "### OpenSSF Scorecard"
            echo
            jq -r '.runs[0].results | length as $n | "\($n) checks below the top score; see the Security tab."' scorecard.sarif
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: scorecard.sarif
          category: scorecard
