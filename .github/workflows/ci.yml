name: ci
on:
  # PR branches are tested by pull_request, and queue branches by merge_group, so a push only
  # needs its own run on main. Testing every branch push too ran each PR twice.
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each batch on a temporary gh-readonly-queue/main/* branch before it lands,
  # so the checks a ruleset requires must run here too or the queue never moves.
  merge_group:
env:
  CARGO_TERM_COLOR: always
  DROIDC_NET_TESTS: "1"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # proot for the bwrap sandbox round trip (spawn::tests::a_sandbox_request_runs_under_proot);
      # PipeWire, WirePlumber and their tools for tests/audio_out.rs
      - run: sudo apt-get update && sudo apt-get install -y proot pipewire pipewire-bin wireplumber dbus-daemon
      - run: cargo test --workspace
        # includes tests/net.rs: real keyless verification of ghcr.io/projectbluefin/bluefin-lts
        # from manifests + .sig only (no layers)
      - name: Root-only unit tests (real chown/chmod/setuid)
        run: |
          BIN=$(cargo test -p droidc --lib --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.kind[0] == "lib") | .executable' | tail -1)
          sudo "$BIN" --exact deploy::tests::fix_ownership_then_undo_as_root
          sudo "$BIN" --exact deploy::tests::apply_ownership_applies_once_as_root
          sudo "$BIN" --exact deploy::tests::root_commands_hand_back_what_they_create
          sudo "$BIN" --exact deploy::tests::root_commands_hand_back_named_containers

  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: musl-${{ matrix.arch }}
      # zig cc is the C compiler for ring/zstd-sys: no musl-gcc package, same recipe on both archs.
      - run: pip install --break-system-packages ziglang==0.13.0 cargo-zigbuild
      - run: cargo zigbuild --release --target ${{ matrix.arch }}-unknown-linux-musl -p droidc
      - name: Check the binary is static
        run: |
          f=target/${{ matrix.arch }}-unknown-linux-musl/release/droidc
          file "$f"
          file "$f" | grep -q 'statically linked'
          "$f" --version
          mkdir -p dist && cp "$f" dist/droidc-${{ matrix.arch }}-linux-musl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: droidc-${{ matrix.arch }}-linux-musl
          path: dist/droidc-${{ matrix.arch }}-linux-musl
      # LD_PRELOAD libraries for the guest: the cgroup shim for its systemd --user (crates/cgshim), and the
      # network-interface and USB shims for everything supervise starts (crates/ifshim, crates/usbshim). The guest is glibc, so these
      # are not the musl build above; target glibc 2.28 so any bootc image's libc is newer.
      - name: Test the shims (preloaded into real programs)
        if: matrix.arch == 'x86_64'
        run: cargo test -p cgshim -p ifshim -p usbshim
      - name: Build the shims (glibc)
        run: |
          rustup target add ${{ matrix.arch }}-unknown-linux-gnu
          for shim in cgshim ifshim usbshim; do
            cargo zigbuild --release --target ${{ matrix.arch }}-unknown-linux-gnu.2.28 -p $shim
            so=target/${{ matrix.arch }}-unknown-linux-gnu/release/lib$shim.so
            file "$so"
            ! objdump -T "$so" | grep -E 'GLIBC_2\.(29|[3-9][0-9])'
            cp "$so" dist/$shim-${{ matrix.arch }}.so
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cgshim-${{ matrix.arch }}
          path: dist/cgshim-${{ matrix.arch }}.so
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ifshim-${{ matrix.arch }}
          path: dist/ifshim-${{ matrix.arch }}.so
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: usbshim-${{ matrix.arch }}
          path: dist/usbshim-${{ matrix.arch }}.so

  # Host-side Android build (bionic, NDK r27c, API 26): shipped by Selkie as libdroidc.so.
  # The musl build above is the guest-side binary (libdroidc-guest.so).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: android
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with:
          ndk-version: r27c
      - run: cargo install cargo-ndk --locked
      - name: Build both ABIs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -t x86_64 --platform 26 build --release -p droidc
      - name: Check binaries
        run: |
          NM=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
          mkdir -p dist
          for t in aarch64 x86_64; do
            f=target/$t-linux-android/release/droidc
            file "$f"; file "$f" | grep -q 'linker64'
            # only bionic libc wrappers: no raw syscalls through rustix
            ! $NM -D --undefined-only "$f" | grep -qw 'syscall@LIBC' || echo "note: imports syscall()"
            cp "$f" dist/droidc-$t-linux-android
          done
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: droidc-aarch64-linux-android
          path: dist/droidc-aarch64-linux-android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: droidc-x86_64-linux-android
          path: dist/droidc-x86_64-linux-android

  integration:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: droidc-${{ matrix.arch }}-linux-musl
          path: bin
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h /
      - run: sudo apt-get update && sudo apt-get install -y proot jq
      - run: chmod +x bin/droidc-${{ matrix.arch }}-linux-musl
      - name: switch / run / second switch / rollback / gc against real registries
        run: tests/ci-integration.sh bin/droidc-${{ matrix.arch }}-linux-musl "$RUNNER_TEMP/r"
      - name: Disk usage
        if: always()
        run: du -sh "$RUNNER_TEMP/r"/* || true
