name: measure-bluefin

# Measures a real Bluefin LTS arm64 deployment on an arm64 runner: download size, unpack time,
# size on disk and hard-link count with the Android link strategy (link2symlink), signature
# verification, a smoke run of os-release / flatpak inside the deployment, and its GNOME session
# headless (supervise --session + bridge --dump-frame) in an unprivileged bwrap sandbox, an inventory
# of what that session needs from systemd, and how far the image's own `systemd --user` gets on the
# cgroup shim (bwrap and proot; report only until there is a baseline).
# Runs when this file changes or by hand.
on:
  push:
    paths:
      - ".github/workflows/measure-bluefin.yml"
      - "crates/droidc/src/supervise.rs"
      - "crates/droidc/src/bridge.rs"
      - "crates/droidc/src/session.rs"
      - "crates/droidc/src/login1.rs"
      - "crates/droidc/src/cgroups.rs"
      - "shim/**"
      - "tests/systemd-probe.sh"
      - "tests/inventory-image.sh"
  workflow_dispatch:
    inputs:
      ref:
        description: image ref
        default: ghcr.io/projectbluefin/bluefin-lts:stable

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      IMAGE: ${{ inputs.ref || 'ghcr.io/projectbluefin/bluefin-lts:stable' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-unknown-linux-musl,aarch64-unknown-linux-gnu
      - run: pip install --break-system-packages ziglang==0.13.0 cargo-zigbuild
      - run: cargo zigbuild --release --target aarch64-unknown-linux-musl -p droidc
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift || true
          sudo apt-get install -y jq >/dev/null
          df -h /
      - name: Switch to Bluefin LTS (verified, link2symlink)
        run: |
          B=$PWD/target/aarch64-unknown-linux-musl/release/droidc
          R=/droidc-measure; sudo mkdir -p $R && sudo chown "$USER" $R
          echo "R=$R" >> "$GITHUB_ENV"
          df -h "$R"
          start=$(date +%s)
          "$B" --root "$R" --json switch "$IMAGE" --links link2symlink | tee switch.ndjson | grep -v '"progress"' || true
          end=$(date +%s)
          echo "wall_seconds=$((end-start))"
          tail -1 switch.ndjson | jq -e '.ok' >/dev/null
          "$B" --root "$R" --json status | tail -1 | jq '.data.current' | tee current.json
      - name: Measurements
        run: |
          echo "### Bluefin LTS arm64 measurement" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- ref: \(.image_ref)\n- manifest: \(.manifest_digest)\n- signature: \(.signature)\n- session_label: \(.session_label)\n- stats: \(.stats)"' current.json | tee -a "$GITHUB_STEP_SUMMARY"
          D=$(readlink -f "$R/current")
          echo "- du -sh rootfs: $(du -sh "$D/rootfs" | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- du -sh blobs: $(du -sh "$R/blobs" | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- l2s entries: $(find "$D/rootfs" -name '.l2s.*' | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- metadata: $(ls -la "$D"/metadata.jsonl.zst)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke-run inside the deployment (chroot, native arm64)
        run: |
          D=$(readlink -f "$R/current")
          # link2symlink targets are absolute host paths: make them resolve inside the chroot.
          sudo mkdir -p "$D/rootfs$R" && sudo mount --bind "$R" "$D/rootfs$R"
          for c in "cat /etc/os-release" "flatpak --version" "ls /usr/bin | wc -l" "bash --version | head -1" "rpm -q gnome-shell" "ls /usr/lib/systemd/systemd" ; do
            echo "\$ $c"; sudo chroot "$D/rootfs" /bin/sh -c "$c" 2>&1 | tee -a smoke.txt || true
          done
          { echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          sudo umount "$D/rootfs$R"
      - name: Inventory of the GNOME session's systemd needs
        run: |
          D=$(readlink -f "$R/current")
          sudo mkdir -p "$D/rootfs$R" && sudo mount --bind "$R" "$D/rootfs$R"
          sudo chroot "$D/rootfs" /bin/sh -s < tests/inventory-image.sh > inventory.md 2>&1 || true
          sudo umount "$D/rootfs$R"
          { echo "### Inventory: what GNOME needs from systemd"; cat inventory.md; } >> "$GITHUB_STEP_SUMMARY"
          wc -l inventory.md
      - name: GNOME session headless (supervise --session, bridge --dump-frame, unprivileged bwrap)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y bubblewrap python3-pil >/dev/null
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          B=$PWD/target/aarch64-unknown-linux-musl/release/droidc
          "$B" --root "$R" --json session set --renderer screencast --name GNOME \
            --exec '["gnome-shell","--headless","--virtual-monitor","{width}x{height}"]' \
            --services '[["pipewire"],["wireplumber"]]' | tail -1 | jq -e .ok
          D=$(readlink -f "$R/current")
          W=$RUNNER_TEMP/gui; mkdir -p $W/tmp $W/run/user/$(id -u) $W/var
          chmod 700 $W/run/user/$(id -u)
          # The app uid of Selkie is unknown to the image: add it, as Selkie does.
          { cat "$D/rootfs/etc/passwd"; echo "selkie:x:$(id -u):$(id -g):Selkie:/root:/bin/bash"; } > $W/passwd
          { cat "$D/rootfs/etc/group"; echo "selkie:x:$(id -g):"; } > $W/group
          set +e
          # Bind order matters: /run first, then the root inside it.
          timeout 300 bwrap --bind "$D/rootfs" / --bind "$R" "$R" \
            --bind $W/tmp /tmp --bind $W/run /run --bind "$R" /run/droidc/root --bind $W/var /var \
            --ro-bind $W/passwd /etc/passwd --ro-bind $W/group /etc/group --ro-bind "$B" /usr/bin/droidc \
            --dev /dev --proc /proc --ro-bind /sys /sys --unshare-pid --die-with-parent --clearenv \
            --setenv HOME /root --setenv PATH /usr/bin:/usr/sbin --setenv DROIDC_ROOT /run/droidc/root \
            --setenv LIBGL_ALWAYS_SOFTWARE 1 --setenv PIPEWIRE_REMOTE pipewire-0-manager \
            /usr/bin/droidc supervise --session --width 1280 --height 800 -- \
            /usr/bin/droidc bridge --width 1280 --height 800 --dump-frame /tmp/gnome.png > session.log 2>&1
          echo "exit=$?"
          set -e
          grep -E "bridge|droidc|warn" session.log | head -20 || true
          cp $W/tmp/gnome.png gnome.png
          python3 -c "from PIL import Image; im=Image.open('gnome.png').convert('RGB'); n=len(set(im.resize((160,100)).getdata())); print('distinct colors', n); assert n > 50, 'uniform frame'"
          echo "- GNOME headless frame: captured (see artifact gnome-frame)" >> "$GITHUB_STEP_SUMMARY"
      - name: systemd --user on the cgroup shim (bwrap, report only)
        continue-on-error: true
        run: |
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.28 -p cgshim
          cp target/aarch64-unknown-linux-gnu/release/libcgshim.so cgshim.so
          B=$PWD/target/aarch64-unknown-linux-musl/release/droidc
          D=$(readlink -f "$R/current")
          W=$RUNNER_TEMP/sd; rm -rf $W; mkdir -p $W/tmp $W/run/user/$(id -u) $W/var $W/cgroup
          chmod 700 $W/run/user/$(id -u); cp tests/systemd-probe.sh $W/tmp/probe.sh
          { cat "$D/rootfs/etc/passwd"; echo "selkie:x:$(id -u):$(id -g):Selkie:/root:/bin/bash"; } > $W/passwd
          { cat "$D/rootfs/etc/group"; echo "selkie:x:$(id -g):"; } > $W/group
          set +e
          timeout 300 bwrap --bind "$D/rootfs" / --bind "$R" "$R" \
            --bind $W/tmp /tmp --bind $W/run /run --bind "$R" /run/droidc/root --bind $W/var /var \
            --ro-bind $W/passwd /etc/passwd --ro-bind $W/group /etc/group --ro-bind "$B" /usr/bin/droidc \
            --dev /dev --proc /proc --ro-bind /sys /sys --bind $W/cgroup /sys/fs/cgroup \
            --ro-bind cgshim.so /usr/lib/droidc/cgshim.so --unshare-pid --die-with-parent --clearenv \
            --setenv HOME /root --setenv PATH /usr/bin:/usr/sbin --setenv DROIDC_ROOT /run/droidc/root \
            --setenv DROIDC_SYSTEMD_STDIO inherit \
            /usr/bin/droidc supervise --systemd=on -- sh /tmp/probe.sh > systemd-bwrap.log 2>&1
          echo "exit=$?"
          { echo "### systemd --user on the cgroup shim (bwrap)"; echo '```'; cat systemd-bwrap.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: systemd --user on the cgroup shim (proot, report only)
        continue-on-error: true
        run: |
          sudo apt-get install -y proot >/dev/null
          B=$PWD/target/aarch64-unknown-linux-musl/release/droidc
          D=$(readlink -f "$R/current")
          W=$RUNNER_TEMP/sdp; rm -rf $W; mkdir -p $W/tmp $W/run/user/$(id -u) $W/var $W/cgroup
          chmod 700 $W/run/user/$(id -u); cp tests/systemd-probe.sh $W/tmp/probe.sh
          set +e
          PROOT_NO_SECCOMP=1 timeout 600 proot -r "$D/rootfs" -w / \
            -b /dev -b /proc -b /sys -b $W/cgroup:/sys/fs/cgroup -b "$R:$R" -b "$R:/run/droidc/root" \
            -b $W/tmp:/tmp -b $W/run:/run -b $W/var:/var -b "$B:/usr/bin/droidc" \
            -b $PWD/cgshim.so:/usr/lib/droidc/cgshim.so \
            /usr/bin/env -i HOME=/root PATH=/usr/bin:/usr/sbin DROIDC_ROOT=/run/droidc/root DROIDC_SYSTEMD_STDIO=inherit \
            /usr/bin/droidc supervise --systemd=on -- sh /tmp/probe.sh > systemd-proot.log 2>&1
          echo "exit=$?"
          { echo "### systemd --user on the cgroup shim (proot)"; echo '```'; cat systemd-proot.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: systemd-user
          path: |
            systemd-bwrap.log
            systemd-proot.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gnome-frame
          path: |
            gnome.png
            session.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: inventory
          path: inventory.md
