[package]
name = "usbshim"
description = "LD_PRELOAD shim that turns an open of a placeholder /dev/bus/usb node into the usbfs fd Android granted"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Loaded into the guest's processes, so it is built for the guest's libc (glibc), not the host's:
# cargo zigbuild --release --target {aarch64,x86_64}-unknown-linux-gnu.2.28 -p usbshim
[lib]
name = "usbshim"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
serde_json = "1"

[dev-dependencies]
libc = "=0.2.191"
