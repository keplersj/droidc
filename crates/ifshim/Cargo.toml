[package]
name = "ifshim"
description = "LD_PRELOAD shim that lists network interfaces where Android refuses the netlink socket glibc asks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Loaded into the guest's processes, so it is built for the guest's libc (glibc), not the host's:
# cargo zigbuild --release --target {aarch64,x86_64}-unknown-linux-gnu.2.28 -p ifshim
[lib]
name = "ifshim"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"

[dev-dependencies]
libc = "=0.2.191"
