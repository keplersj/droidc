[package]
name = "droidc"
description = "Run bootc images on Android under proot: pull, verify, unpack, deploy, rollback"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "droidc"
path = "src/lib.rs"

[[bin]]
name = "droidc"
path = "src/main.rs"

[dependencies]
# Kept (unused until the real verifier is swapped into verify_glue.rs).
droidc-verify = { path = "../droidc-verify" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
zstd = "0.13"
rustix = { version = "1", features = ["fs", "system", "process", "mm", "pipe", "event", "mount", "thread"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
# signal(2) for `enter` (std has no API, rustix keeps sigaction internal).
libc = "0.2"
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio"] }
# `droidc bridge`: Mutter ScreenCast/RemoteDesktop over D-Bus, presented as a Wayland client.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

# Android's app seccomp filter lacks legacy syscalls (mkdir, chmod, unlink, ...) on x86_64, and rustix's
# default linux_raw backend issues raw syscalls: go through bionic's libc wrappers instead.
[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "1", features = ["use-libc"] }

[dev-dependencies]
tempfile = "3"
