[package]
name = "droidc"
description = "Run bootc images on Android under proot: pull, verify, unpack, deploy, rollback"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "droidc"
path = "src/lib.rs"

[[bin]]
name = "droidc"
path = "src/main.rs"

[dependencies]
# Kept (unused until the real verifier is swapped into verify_glue.rs).
droidc-verify = { path = "../droidc-verify" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
zstd = "0.13"
rustix = { version = "1", features = ["fs", "system", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
