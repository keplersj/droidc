[package]
name = "cgshim"
description = "LD_PRELOAD shim that lets the guest's systemd --user run where the kernel gives it no cgroup filesystem"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Loaded into the guest's processes, so it is built for the guest's libc (glibc), not the host's:
# cargo zigbuild --release --target {aarch64,x86_64}-unknown-linux-gnu.2.28 -p cgshim
[lib]
name = "cgshim"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"

[dev-dependencies]
libc = "=0.2.191"
