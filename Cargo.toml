[workspace]
resolver = "2"
members = ["crates/droidc", "crates/droidc-verify", "crates/cgshim"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/keplersj/droidc"
rust-version = "1.85"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
